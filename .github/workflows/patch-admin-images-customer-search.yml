name: Patch admin images customer search

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert customer search into admin image manager
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'admin-images.html';
          let html = fs.readFileSync(file, 'utf8');
          if (html.includes('id="customerSearch"')) {
            console.log('customer search already exists');
            process.exit(0);
          }
          html = html.replace('.toolbar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.toolbar input{flex:1;min-width:240px}', '.toolbar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.toolbar input{flex:1;min-width:240px}.toolbar .customer-search{border-color:rgba(242,170,60,.45);background:rgba(242,170,60,.08)}');
          html = html.replace('<input id="search" placeholder="搜索标题 / 城市 / 联系方式 / 发布者">', '<input id="customerSearch" class="customer-search" placeholder="搜客人：姓名 / 电话 / 联系方式">\n        <input id="search" placeholder="搜信息：标题 / 城市 / 分类">');
          const oldRender = `function render(){const q=($('search').value||'').toLowerCase().trim();const rows=listings.filter(row=>{const p=row.profiles||{};const text=[row.title,row.city,row.contact,row.category,row.status,p.nickname,p.phone].join(' ').toLowerCase();return !q||text.includes(q)});if(!rows.length){$('cards').innerHTML='<div class="sub">没有符合条件的信息</div>';return}$('cards').innerHTML=rows.map(row=>{const user=row.profiles?.nickname||'游客/未知';return \`<article class="card" id="card-\${row.id}"><div class="photos" id="photos-\${row.id}">\${renderPhotos(row)}</div><div class="body"><div class="title">\${esc(row.title||'未命名信息')}</div><div class="meta"><span>#\${row.id}</span><span>\${esc(row.category||'')}</span><span>📍\${esc(row.city||'')}</span><span>\${esc(user)}</span></div><div class="actions"><label class="file-pick">📁 从电脑选择照片<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple onchange="chooseImages(\${row.id},this)"></label><div class="file-note">最多6张，每张不超过5MB。选择后先预览，再上传替换。</div><div class="selected-count" id="count-\${row.id}"></div><div class="preview" id="preview-\${row.id}"></div><button class="btn green" onclick="saveImages(\${row.id})">上传并替换图片</button></div></div></article>\`}).join('')}`;
          const newRender = `function render(){const q=($('search').value||'').toLowerCase().trim();const cq=($('customerSearch').value||'').toLowerCase().trim();const rows=listings.filter(row=>{const p=row.profiles||{};const infoText=[row.title,row.city,row.category,row.status,row.address].join(' ').toLowerCase();const customerText=[p.nickname,p.phone,row.contact].join(' ').toLowerCase();return (!q||infoText.includes(q))&&(!cq||customerText.includes(cq))});if(!rows.length){$('cards').innerHTML='<div class="sub">没有符合条件的信息</div>';return}$('cards').innerHTML=rows.map(row=>{const user=row.profiles?.nickname||'游客/未知';const phone=row.profiles?.phone||row.contact||'';return \`<article class="card" id="card-\${row.id}"><div class="photos" id="photos-\${row.id}">\${renderPhotos(row)}</div><div class="body"><div class="title">\${esc(row.title||'未命名信息')}</div><div class="meta"><span>#\${row.id}</span><span>\${esc(row.category||'')}</span><span>📍\${esc(row.city||'')}</span><span>👤\${esc(user)}</span>\${phone?\`<span>☎ \${esc(phone)}</span>\`:''}</div><div class="actions"><label class="file-pick">📁 从电脑选择照片<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple onchange="chooseImages(\${row.id},this)"></label><div class="file-note">最多6张，每张不超过5MB。选择后先预览，再上传替换。</div><div class="selected-count" id="count-\${row.id}"></div><div class="preview" id="preview-\${row.id}"></div><button class="btn green" onclick="saveImages(\${row.id})">上传并替换图片</button></div></div></article>\`}).join('')}`;
          if (!html.includes(oldRender)) throw new Error('Could not find render function');
          html = html.replace(oldRender, newRender);
          html = html.replace("$('search').oninput=render;$('password')", "$('search').oninput=render;$('customerSearch').oninput=render;$('password')");
          fs.writeFileSync(file, html);
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-images.html
          git diff --cached --quiet || git commit -m "Add customer search to admin image manager"
          git push
