name: Patch admin images entry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert image manager entry
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'admin.html';
          let html = fs.readFileSync(file, 'utf8');
          if (html.includes('/admin-images.html')) {
            console.log('admin image entry already exists');
            process.exit(0);
          }
          const entry = '    <a class="nav-item" href="/admin-images.html">\n      <span>🖼️</span> 图片美化 / 上传照片\n    </a>\n';
          const hotAds = '    <a class="nav-item" href="/admin-hotads.html">\n      <span>🔥</span> 今日热卖广告\n    </a>\n';
          const pinned = '    <div class="nav-item" data-section="pinned" onclick="showPage(\'pinned\',this)">\n      <span>📌</span> 置顶管理\n    </div>\n';
          if (html.includes(hotAds)) {
            html = html.replace(hotAds, hotAds + entry);
          } else if (html.includes(pinned)) {
            html = html.replace(pinned, pinned + entry);
          } else {
            throw new Error('Could not find admin sidebar insertion point');
          }
          fs.writeFileSync(file, html);
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet || git commit -m "Add admin image manager entry"
          git push
